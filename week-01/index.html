<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomiris Profile Card</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<header class="text-center p-6">
  <h1 class="text-3xl font-bold">My Profile</h1>
</header>

<main class="flex justify-center">
  <section id="card" class="bg-white p-6 rounded-xl shadow-lg max-w-sm">

    <img src="profile.jpg" alt="Tomiris"
      class="w-40 h-40 rounded-full mx-auto object-cover">

    <h2 class="text-2xl font-bold text-center mt-4">
      Tomiris Oraz
    </h2>

    <p class="text-center text-gray-600 mt-2">
      I am an aspiring web developer. I enjoy learning HTML, CSS and JavaScript.
      My goal is to become a frontend developer.
    </p>

    <div class="flex justify-center gap-4 mt-4">
      <a href="mailto:tomiris@example.com" class="text-blue-600">Email</a>
      <a href="https://github.com/Tomiris-lab1112" class="text-blue-600">GitHub</a>
    </div>

    <button id="likeBtn"
      class="mt-6 w-full bg-pink-500 text-white py-2 rounded-lg">
      🤍 Like
    </button>

  </section>
</main>

<footer class="text-center p-6 text-gray-500">
  2026 Tomiris Oraz
</footer>

<script src="script.js"></script>

</body>
</html>
